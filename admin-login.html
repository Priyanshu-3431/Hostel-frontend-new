<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | College Hostel Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand">🏠 Hostel Portal</a>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="register.html">Student Register</a>
      <a href="login.html">Student Login</a>
      <a href="admin-login.html" class="btn-nav active">Admin Login</a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="form-wrap">
      <h2>Admin Login</h2>
      <p class="sub">Restricted access — hostel administrators only</p>

      <div class="alert alert-error" id="errorAlert"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@hostel.edu">
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password">
          <div class="field-error" id="passwordError"></div>
        </div>
        <button type="submit" class="btn btn-solid btn-block" id="submitBtn">Login as Admin</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="foot-links">
    <a href="index.html">Home</a>
    <a href="login.html">Student Login</a>
  </div>
  <small>&copy; <span id="year"></span> College Hostel Management System. All rights reserved.</small>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
